name: Calendar, help and preserved Material World verification
on:
  push:
    branches: [feat/bkit-calendar-help-polish-20261025]
    paths-ignore: ['study-os/docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        browser: [desktop, webkit-iphone, webkit-ipad, webkit-ipad-landscape]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: study-os
    env:
      APP_BASE: /
      BKIT_TEST_BASE_URL: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-local-vision.mjs
      - run: npx playwright install --with-deps ${{ matrix.browser == 'desktop' && 'chromium' || 'webkit' }}
        timeout-minutes: 10
      - name: Study, answers, offline, materials, Awake, calendar and help
        run: >-
          npm run test:e2e -- tests/e2e/live-study-recovery.spec.ts
          tests/e2e/compact-experience.spec.ts tests/e2e/compact-offline.spec.ts
          tests/e2e/material-world.spec.ts tests/e2e/awake-intelligence.spec.ts
          tests/e2e/calendar-help-polish.spec.ts --project=${{ matrix.browser }} --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-help-${{ github.sha }}-${{ matrix.browser }}
          path: |
            study-os/docs/calendar-help-20261025/verified/
            study-os/test-results/
            artifacts/compact-experience/
          retention-days: 14
