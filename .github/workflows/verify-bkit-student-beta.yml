name: Verify BKIT 3.9 student beta
on:
  push:
    branches: [feat/bkit-39-student-beta-20261021]
    paths: ['study-os/**', '.github/workflows/verify-bkit-student-beta.yml', 'vercel.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bkit-student-beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, webkit-iphone, webkit-ipad, webkit-ipad-landscape]
    defaults:
      run:
        working-directory: study-os
    env:
      APP_BASE: /
      BKIT_TEST_BASE_URL: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify capture, schedules, calendar, storage, timer, PDF and offline themes
        run: >-
          npx playwright test
          tests/e2e/student-beta.spec.ts tests/e2e/recovery.spec.ts
          tests/e2e/internal-reliability.spec.ts tests/e2e/digital-paper.spec.ts
          tests/e2e/compact-offline.spec.ts tests/e2e/cloud-lifecycle.spec.ts
          --project=${{ matrix.device }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bkit-beta-${{ matrix.device }}
          path: study-os/test-results/
          retention-days: 7
