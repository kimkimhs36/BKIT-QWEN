name: Verify preserved BKIT live study
on:
  push:
    branches: [fix/bkit-live-study-start-20261023]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bkit-live-study-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, webkit-iphone, webkit-ipad]
    defaults:
      run:
        working-directory: study-os
    env:
      APP_BASE: /
      BKIT_TEST_BASE_URL: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- tests/e2e/live-study-recovery.spec.ts tests/e2e/compact-experience.spec.ts tests/e2e/compact-offline.spec.ts --project=${{ matrix.project }} --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-study-${{ matrix.project }}
          path: |
            study-os/test-results/
            artifacts/compact-experience/${{ matrix.project }}/
          retention-days: 14
