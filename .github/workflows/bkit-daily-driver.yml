name: BKIT daily driver verified release
on:
  push:
    branches: [feat/bkit-daily-driver-20261025]
permissions:
  contents: read
concurrency:
  group: bkit-daily-driver-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: study-os
    env:
      APP_BASE: /
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-local-vision.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-dist
          path: study-os/dist/
  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, webkit-iphone, webkit-ipad, webkit-ipad-landscape]
    defaults:
      run:
        working-directory: study-os
    env:
      APP_BASE: /
      BKIT_TEST_BASE_URL: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-dist
          path: study-os/dist/
      - run: npx playwright install --with-deps chromium webkit
      - run: >-
          npm run test:e2e --
          tests/e2e/study-record-management.spec.ts tests/e2e/calendar-help-polish.spec.ts
          tests/e2e/compact-experience.spec.ts tests/e2e/compact-offline.spec.ts
          tests/e2e/live-study-recovery.spec.ts tests/e2e/private-sync.spec.ts
          tests/e2e/capture-v2.spec.ts tests/e2e/storage-readiness.spec.ts
          tests/e2e/daily-driver.spec.ts --project=${{ matrix.project }} --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: daily-driver-${{ matrix.project }}
          path: |
            study-os/test-results/
            study-os/docs/daily-driver-20261025/after/
            study-os/docs/calendar-help-20261025/
            artifacts/compact-experience/
  publish:
    needs: [build, verify]
    if: github.repository == 'kimkimhs36/BKIT-QWEN' && github.ref == 'refs/heads/feat/bkit-daily-driver-20261025'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    concurrency:
      group: bkit-safe-production-teambkit-only
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-dist
          path: /tmp/bkit-verified-dist/
      - name: Verify destination and publish tested artifacts with concurrency protection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'kimkimhs36/BKIT-QWEN'
          gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/bkit-pages-config.json
          jq -e '.cname=="teambkit.com" and .source.branch=="main" and .source.path=="/"' /tmp/bkit-pages-config.json
          grep -Fxq 'teambkit.com' CNAME
          test -f .nojekyll
          test ! -d study-os/src
          baseline=$(git rev-parse HEAD)
          git ls-remote origin refs/heads/feat/bkit-daily-driver-20261025 | awk '{print $1}' > /tmp/bkit-source-head
          test "$(cat /tmp/bkit-source-head)" = "$SOURCE_SHA"
          sha256sum exam-lab/index.html mock-rescue/index.html > /tmp/bkit-routes.sha256
          node - <<'JS'
          const fs=require('fs');
          const prior=JSON.parse(fs.readFileSync('release.json'));
          if (!prior.product.startsWith('BKIT STUDY OS')) throw Error('Wrong product');
          const build=JSON.parse(fs.readFileSync('/tmp/bkit-verified-dist/build-info.json'));
          if(build.sourceCommit!==process.env.SOURCE_SHA)throw Error('Untested source');
          if(JSON.parse(fs.readFileSync('/tmp/bkit-verified-dist/manifest.webmanifest')).name!=='BKIT STUDY OS')throw Error('Wrong manifest');
          fs.writeFileSync('/tmp/bkit-prior-release.json',JSON.stringify(prior));
          JS
          git push origin "$baseline:refs/heads/checkpoint/bkit-daily-$SOURCE_SHA"
          cp -a /tmp/bkit-verified-dist/. ./
          BASELINE="$baseline" node - <<'JS'
          const fs=require('fs'),prior=JSON.parse(fs.readFileSync('/tmp/bkit-prior-release.json'));
          fs.writeFileSync('release.json',JSON.stringify({product:'BKIT STUDY OS · Daily Driver',sourceCommit:process.env.SOURCE_SHA,sourceBranch:'feat/bkit-daily-driver-20261025',previousSource:prior.sourceCommit,rollbackCommit:process.env.BASELINE,publishedAt:new Date().toISOString(),validation:'TypeScript, 271 unit/integration tests, exact-build desktop and three WebKit device matrices',ci:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,apiSource:'f1439874063df4f17fa60d667fa5efe9ea2ba9f8',notes:'Static artifacts only; existing hashed assets, independent routes and browser study storage preserved.'},null,2)+'\n');
          JS
          sha256sum -c /tmp/bkit-routes.sha256
          grep -Fxq 'teambkit.com' CNAME
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          test -z "$(git diff --cached --name-only --diff-filter=D)"
          git commit -m "deploy: verified BKIT daily driver $SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$baseline"
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/bkit-pages-sha
      - name: Verify exact Pages commit and public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
          for i in $(seq 1 45); do
            gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" > /tmp/bkit-built.json
            if jq -e --arg sha "$(cat /tmp/bkit-pages-sha)" '.status=="built" and .commit==$sha' /tmp/bkit-built.json; then break; fi
            sleep 8
          done
          jq -e --arg sha "$(cat /tmp/bkit-pages-sha)" '.status=="built" and .commit==$sha' /tmp/bkit-built.json
          for i in $(seq 1 30); do
            if curl -fsSL "https://teambkit.com/release.json?source=$SOURCE_SHA" | jq -e --arg sha "$SOURCE_SHA" '.sourceCommit==$sha'; then exit 0; fi
            sleep 8
          done
          exit 1
