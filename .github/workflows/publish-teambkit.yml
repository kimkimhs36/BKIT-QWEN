name: Publish BKIT Study OS to teambkit.com

on:
  push:
    branches:
      - feat/study-os-visual-v2
    paths:
      - 'study-os/**'
      - '.github/workflows/publish-teambkit.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: teambkit-com-publication
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Study OS source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitHub Pages' deployment for 3cff3c0 timed out and left a server-side lock.
      # Subsequent Pages runs receive HTTP 400: "due to in progress deployment".
      # Cancel only this known stale deployment, never the latest successful deploy.
      - name: Release stale GitHub Pages deployment lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          stuck="3cff3c094b2649e78708cf7a1ee90695252d3f9e"
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${stuck}/cancel"
          code=$(curl -sS -L -o /tmp/bkit-pages-cancel.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${url}")
          echo "Pages deployment lock cancel result: HTTP ${code}"
          if [[ "${code}" != "204" && "${code}" != "404" ]]; then
            cat /tmp/bkit-pages-cancel.json
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-os/package-lock.json

      - name: Install locked dependencies
        working-directory: study-os
        run: npm ci

      - name: Run unit tests
        working-directory: study-os
        run: npm test

      - name: Typecheck and build for root domain
        working-directory: study-os
        env:
          APP_BASE: /
        run: npm run build

      - name: Test iPhone/iPad study preparation and regression flows
        working-directory: study-os
        env:
          BKIT_TEST_BASE_URL: http://127.0.0.1:4173/
          APP_BASE: /
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:e2e -- tests/e2e/atelier.spec.ts --project=iphone --project=webkit-iphone --project=webkit-ipad --retries=1
          npm run test:e2e -- tests/e2e/focus-restore.spec.ts tests/e2e/home-simple.spec.ts tests/e2e/soft-ui.spec.ts tests/e2e/liquid-optics.spec.ts tests/e2e/ios-navigation.spec.ts tests/e2e/research-now.spec.ts tests/e2e/capture-v2.spec.ts tests/e2e/quality-v10.spec.ts tests/e2e/dock-fixed.spec.ts tests/e2e/cloud-sync.spec.ts tests/e2e/assistant.spec.ts --project=iphone --retries=1
          npm run test:e2e -- tests/e2e/liquid-optics.spec.ts tests/e2e/ios-navigation.spec.ts tests/e2e/research-now.spec.ts tests/e2e/capture-v2.spec.ts tests/e2e/quality-v10.spec.ts tests/e2e/dock-fixed.spec.ts tests/e2e/cloud-sync.spec.ts tests/e2e/assistant.spec.ts --project=webkit-iphone --retries=1

      - name: Checkout existing site branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: teambkit-site
          fetch-depth: 1
          persist-credentials: true

      - name: Publish tested static assets to teambkit.com
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp -a study-os/dist/. teambkit-site/
          # Keep the independent Safari-safe entry synced to every successful build.
          # This URL never points to an old fingerprinted JS/CSS bundle.
          cp study-os/dist/index.html teambkit-site/tohesar-juggernaut-20261016.html
          printf 'teambkit.com\n' > teambkit-site/CNAME
          touch teambkit-site/.nojekyll
          node -e 'require("node:fs").writeFileSync("teambkit-site/release.json", JSON.stringify({product:"TOHESAR x BKIT Private Study Atelier",sourceCommit:process.env.SOURCE_SHA,publishedAt:new Date().toISOString()}))'

          # The new HTML no longer references the legacy CRASH//WEEK files.
          rm -f teambkit-site/app.js teambkit-site/styles.css

          cd teambkit-site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No changes to deploy.'
          else
            git commit -m "deploy: BKIT STUDY OS v2 (${SOURCE_SHA})"
            git push origin HEAD:main
          fi

      # A push made with GITHUB_TOKEN does not reliably schedule a legacy Pages
      # build. Request it explicitly, then verify both its commit and the live site.
      - name: Build and verify the final GitHub Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        working-directory: teambkit-site
        run: |
          set -euo pipefail
          site_sha=$(git rev-parse HEAD)
          gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" > /tmp/bkit-pages-build.json
          # Reuse an automatic build when already visible. Explicit requests can
          # race with Pages' own queue; a canceled duplicate is not final failure.
          if ! jq -e --arg commit "$site_sha" '.commit == $commit and (.status == "built" or .status == "building" or .status == "queued")' /tmp/bkit-pages-build.json; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /tmp/bkit-pages-request.json
          fi
          for attempt in $(seq 1 36); do
            gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" > /tmp/bkit-pages-build.json
            status=$(jq -r '.status' /tmp/bkit-pages-build.json)
            built_sha=$(jq -r '.commit' /tmp/bkit-pages-build.json)
            if [[ "$status" == "built" && "$built_sha" == "$site_sha" ]]; then
              break
            fi
            if [[ "$attempt" == "36" ]]; then
              echo 'Timed out waiting for the exact GitHub Pages commit.'
              jq '{status, commit, error}' /tmp/bkit-pages-build.json
              exit 1
            fi
            sleep 10
          done
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "https://teambkit.com/release.json?source=${SOURCE_SHA}" > /tmp/bkit-live-release.json && \
              jq -e --arg source "$SOURCE_SHA" '.sourceCommit == $source' /tmp/bkit-live-release.json; then
              echo "Verified teambkit.com source ${SOURCE_SHA} / Pages ${site_sha}"
              exit 0
            fi
            sleep 10
          done
          echo 'GitHub Pages built, but the live release has not matched yet.'
          exit 1
