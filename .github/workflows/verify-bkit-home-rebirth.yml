name: Verify BKIT 4 home rebirth
on:
  push:
    branches: [feat/bkit-4-home-rebirth-20261022]
    paths: ['study-os/src/**', 'study-os/tests/**', 'study-os/public/**', 'study-os/package*.json', 'study-os/tsconfig*.json', 'study-os/vite.config.ts', 'study-os/buildMetadata.ts', 'study-os/playwright.config.ts', '.github/workflows/verify-bkit-home-rebirth.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bkit-home-rebirth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, webkit-iphone, webkit-ipad, webkit-ipad-landscape]
    defaults:
      run:
        working-directory: study-os
    env:
      APP_BASE: /
      BKIT_SOURCE_COMMIT: ${{ github.sha }}
      BKIT_SOURCE_BRANCH: ${{ github.ref_name }}
      BKIT_TEST_BASE_URL: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify learning, drafts, capture, schedules, records and backup
        run: >-
          npx playwright test tests/e2e/material-touch.spec.ts tests/e2e/home-rebirth.spec.ts tests/e2e/first-learning-action.spec.ts tests/e2e/learning-draft.spec.ts tests/e2e/briefing-discovery.spec.ts tests/e2e/submission-entry.spec.ts
          tests/e2e/student-beta.spec.ts tests/e2e/recovery.spec.ts
          tests/e2e/clean-study-loop.spec.ts tests/e2e/internal-reliability.spec.ts
          tests/e2e/compact-offline.spec.ts tests/e2e/cloud-lifecycle.spec.ts
          --project=${{ matrix.device }}
      - name: Preserve all nine themes with a running clock
        run: npx playwright test tests/e2e/compact-experience.spec.ts --grep 'all nine themes' --project=${{ matrix.device }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bkit-learning-${{ matrix.device }}
          path: study-os/test-results/
          retention-days: 7
