name: Verify BKIT Compact UX (no deployment)
on:
  push:
    branches: [feat/bkit-compact-ux-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: study-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
