name: Verify BKIT preserved learning flows
on:
  push:
    branches: [feat/bkit-product-recovery-20261021]
    paths: [.github/workflows/verify-bkit-preserved-learning.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserved-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: study-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - name: Run unchanged learning regression tests with normal motion
        run: npx playwright test tests/e2e/compact-experience.spec.ts --project=webkit-iphone --grep 'all nine themes|PDF originals|task focus|task modal handles|every tool'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bkit-preserved-learning-verification
          path: |
            artifacts/compact-experience/webkit-iphone/
            study-os/test-results/
