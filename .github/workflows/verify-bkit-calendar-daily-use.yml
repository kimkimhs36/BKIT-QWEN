name: Verify BKIT calendar daily use
on:
  push:
    branches: [feat/bkit-4-calendar-daily-use-20261023]
    paths:
      - 'study-os/src/**'
      - 'study-os/tests/**'
      - 'study-os/package*.json'
      - '.github/workflows/verify-bkit-calendar-daily-use.yml'
  pull_request:
    paths:
      - 'study-os/src/StudyCalendar.tsx'
      - 'study-os/src/App.tsx'
      - 'study-os/src/home-rebirth.css'
      - 'study-os/tests/e2e/calendar-daily-use.spec.ts'
permissions:
  contents: read
concurrency:
  group: bkit-calendar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [iphone, webkit-iphone, webkit-ipad]
    defaults:
      run:
        working-directory: study-os
    env:
      APP_BASE: /
      BKIT_SOURCE_COMMIT: ${{ github.sha }}
      BKIT_SOURCE_BRANCH: ${{ github.ref_name }}
      BKIT_TEST_BASE_URL: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Calendar registration, deadline, focus, and home regressions
        run: >-
          npx playwright test
          tests/e2e/calendar-daily-use.spec.ts
          tests/e2e/home-rebirth.spec.ts
          tests/e2e/school-ready.spec.ts
          --project=${{ matrix.project }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bkit-calendar-${{ matrix.project }}
          path: study-os/test-results/
          retention-days: 7
