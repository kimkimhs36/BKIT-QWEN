name: BKIT action-first home validation
on:
  push:
    branches:
      - preview/bkit-action-home-20261109
    paths:
      - 'study-os/src/PremiumHome.tsx'
      - 'study-os/src/SleepHomeActions.tsx'
      - 'study-os/src/homeSleepSteps.ts'
      - 'study-os/src/actionFirst.ts'
      - 'study-os/src/homeDueReview.ts'
      - 'study-os/src/evidenceWeek.ts'
      - 'study-os/src/EvidenceWeek.tsx'
      - 'study-os/tests/actionFirst.test.ts'
      - 'study-os/tests/homeDueReview.test.ts'
      - 'study-os/tests/evidenceWeek.test.ts'
      - 'study-os/tests/e2e/evidence-week.spec.ts'
      - 'study-os/tests/e2e/action-first-mobile.spec.ts'
      - 'study-os/tests/homeSleepSteps.test.ts'
      - 'study-os/src/App.tsx'
      - 'study-os/src/daily-driver.css'
      - '.github/workflows/bkit-action-home-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bkit-action-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-home-tests:
    name: Action-first behavior and canonical sleep record
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: study-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Focused user-behavior regression
        run: npx vitest run tests/actionFirst.test.ts tests/homeSleepSteps.test.ts tests/homeDueReview.test.ts tests/evidenceWeek.test.ts
      - name: TypeScript and production build
        run: npm run build
      - name: Install Chromium for mobile scenario
        run: npx playwright install --with-deps chromium
      - name: Real-app mobile action-first start and save
        run: npx playwright test tests/e2e/action-first-mobile.spec.ts tests/e2e/evidence-week.spec.ts --project=iphone --reporter=list
      - name: Install WebKit for Safari-engine iPhone emulation
        run: npx playwright install --with-deps webkit
      - name: Safari-engine mobile action-first start and save
        run: npx playwright test tests/e2e/action-first-mobile.spec.ts tests/e2e/evidence-week.spec.ts --project=webkit-iphone --reporter=list
      - name: Publish synthetic mobile UI screenshots (Chromium + Safari)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bkit-mobile-evidence-screens-${{ github.sha }}
          path: |
            study-os/test-results/**/home-*-synthetic.png
            study-os/test-results/**/evidence-*-synthetic.png
            study-os/test-results/**/evidence-with-synthetic-records.png
          if-no-files-found: warn
          retention-days: 7
      - name: Verify real-app static bundle integrity
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          const html = readFileSync('dist/index.html', 'utf8');
          const assets = [...html.matchAll(/(?:src|href)=["']([^"']*assets\/[^"']+)["']/g)].map(m => m[1]);
          if (!assets.length) throw new Error('No app assets referenced by index.html');
          // The public Vite base (/study-os/) is a URL prefix, not a folder in dist/.
          const appBase = (process.env.APP_BASE || '/study-os/').replace(/\/?$/, '/');
          for (const url of assets) {
            const pathname = url.split(/[?#]/, 1)[0];
            const relative = pathname.startsWith(appBase)
              ? pathname.slice(appBase.length)
              : pathname.replace(/^\.?\//, '');
            if (!relative.startsWith('assets/') || relative.includes('..'))
              throw new Error('Unexpected compiled asset URL: ' + url);
            if (!statSync(join('dist', relative)).isFile())
              throw new Error('Missing asset: ' + relative);
          }
          const js = readdirSync('dist/assets').filter(n => n.endsWith('.js'));
          if (!js.length) throw new Error('No compiled application JS found');
          console.log('Real app bundle:', js.length, 'JS chunks,', assets.length, 'entry assets');
          NODE
      - name: Explain non-production artifact
        run: |
          {
            echo '### BKIT actual-app build (not a live deployment)'
            echo 'This build includes the real study-os app, not the standalone action-first demo.'
            echo 'Download the build artifact below after this workflow succeeds.'
            echo 'Static bundles may require HTTP hosting; opening index.html from a file URL is not guaranteed.'
            echo 'Production branch, domain, and existing user data remain unchanged.'
            echo "Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish actual-app build for review (not production)
        uses: actions/upload-artifact@v4
        with:
          name: bkit-action-home-build-${{ github.sha }}
          path: study-os/dist/
          if-no-files-found: error
          retention-days: 7
