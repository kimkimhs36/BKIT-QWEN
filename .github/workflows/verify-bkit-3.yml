name: Verify BKIT STUDY OS 3.0
on:
  push:
    branches: [feat/bkit-3-sleep-guard]
  pull_request:
    branches: [feat/study-os-visual-v2]
permissions:
  contents: read
jobs:
  local-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [iphone, desktop, webkit-iphone, webkit-ipad, galaxy-css]
    defaults:
      run:
        working-directory: study-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- tests/e2e/bkit-3.spec.ts tests/e2e/tools-toggle.spec.ts tests/e2e/study-start.spec.ts tests/e2e/home-clarity.spec.ts --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bkit-3-${{ matrix.project }}
          path: study-os/test-results/
          retention-days: 14
