name: JUGGERNAUT BUILD 02 verification (no production deploy)
on:
  push:
    branches: [feat/juggernaut-build02-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_BASE: /
      # Match the deployed Preview: JUGGERNAUT API shares the app origin.
      # Production Pages uses its separately approved external API URL.
      VITE_JUGGERNAUT_API_URL: ''
      BKIT_TEST_BASE_URL: http://127.0.0.1:4173/
    defaults:
      run:
        working-directory: study-os
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/e2e/juggernaut.spec.ts tests/e2e/juggernaut-build02.spec.ts --project=desktop --project=webkit-iphone --project=webkit-ipad --project=galaxy-css --project=ipad-landscape
      - name: Existing BKIT regression
        run: npx playwright test tests/e2e/daily-driver.spec.ts tests/e2e/study-record-management.spec.ts --project=desktop --output=test-results-regression
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: juggernaut-build02-browser-results
          path: |
            study-os/test-results/
            study-os/test-results-regression/
