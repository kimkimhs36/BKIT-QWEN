name: Verify BKIT Real Life Command Center (no deployment)
on:
  push:
    branches: [feat/bkit-real-life-command-center-20261028]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bkit-real-life-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: study-os
    env:
      APP_BASE: /
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify date, school subject and lifecycle regressions
        run: npm run test -- tests/dailyTriage.test.ts
      - name: Run complete unit suite
        run: npm test
      - name: Verify production frontend build
        run: npm run build
