name: Verify BKIT Real Life Command Center (no deployment)
on:
  push:
    branches: [feat/bkit-real-life-command-center-20261028, feat/bkit-real-life-build04-clipboard-tomorrow, feat/bkit-books-real-life-build05]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bkit-real-life-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: study-os
    env:
      APP_BASE: /
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify date, school subject and lifecycle regressions
        run: npm run test -- tests/dailyTriage.test.ts tests/noticePaste.test.ts tests/books.test.ts
      - name: Run complete unit suite
        run: npm test
      - name: Verify production frontend build
        run: npm run build
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: iPhone clipboard to School Inbox e2e
        env:
          BKIT_TEST_BASE_URL: http://127.0.0.1:4173/
        run: npm run test:e2e -- tests/e2e/real-life-clipboard.spec.ts tests/e2e/books.spec.ts --project=iphone --workers=1
