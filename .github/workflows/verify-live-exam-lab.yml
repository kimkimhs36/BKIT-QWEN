name: Verify Live EXAM LAB October 20
on:
  push:
    branches: [main]
    paths:
      - exam-lab/**
      - .github/workflows/verify-live-exam-lab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-study-room:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm independent exam lab deployed with question bank and scripts
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://teambkit.com/exam-lab/?source=${SHA}" > /tmp/lab.html &&
               curl --fail --silent --show-error --location --max-time 20 "https://teambkit.com/exam-lab/questions.js?source=${SHA}" > /tmp/lab-questions.js &&
               curl --fail --silent --show-error --location --max-time 20 "https://teambkit.com/exam-lab/app.js?source=${SHA}" > /tmp/lab-app.js &&
               curl --fail --silent --show-error --location --max-time 20 "https://teambkit.com/exam-lab/style.css?source=${SHA}" > /tmp/lab-style.css &&
               grep -q 'BKIT EXAM LAB' /tmp/lab.html &&
               grep -q 'window.BKIT_EXAM_QUESTIONS' /tmp/lab-questions.js &&
               grep -q 'bkit.exam-lab.20261019.v1' /tmp/lab-app.js &&
               grep -q '.question-reading' /tmp/lab-style.css; then
              node --check /tmp/lab-app.js
              node --check /tmp/lab-questions.js
              echo "PASS: https://teambkit.com/exam-lab/ serves all validated study modules"
              exit 0
            fi
            echo "Waiting for GitHub Pages to publish EXAM LAB: ${attempt}/45"
            sleep 8
          done
          echo "FAIL: EXAM LAB files not fully published on teambkit.com"
          exit 1
