name: Verify BKIT private API

on:
  push:
    branches:
      - deploy/bkit-api
    paths:
      - 'study-os/**'
      - '.github/workflows/verify-bkit-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: study-os
      - name: Unit tests, including private API access
        run: npm test
        working-directory: study-os
      - name: Typecheck
        run: npm run typecheck
        working-directory: study-os
      - name: Confirm public production API responds
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            code=$(curl --silent --show-error --location --max-time 8 --output /tmp/bkit-health.json --write-out '%{http_code}' https://bkit-api.vercel.app/api/health || true)
            echo "Attempt $i: HTTP $code"
            if [[ "$code" == "200" ]] && grep -q '"service":"bkit-api"' /tmp/bkit-health.json; then
              cat /tmp/bkit-health.json
              exit 0
            fi
            if [[ -f /tmp/bkit-health.json ]]; then head -c 400 /tmp/bkit-health.json; echo; fi
            sleep 7
          done
          echo "Production health endpoint failed" >&2
          exit 1
