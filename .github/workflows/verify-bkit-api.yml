name: Verify BKIT private API

on:
  push:
    branches:
      - deploy/bkit-api
    paths:
      - 'study-os/**'
      - '.github/workflows/verify-bkit-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: study-os
      - name: Unit tests, including private API access
        run: npm test
        working-directory: study-os
      - name: Typecheck
        run: npm run typecheck
        working-directory: study-os
