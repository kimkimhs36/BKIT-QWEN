name: Verify BKIT product recovery
on:
  push:
    branches: [feat/bkit-product-recovery-20261021]
    paths: ['study-os/**', '.github/workflows/verify-bkit-recovery.yml', 'vercel.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: study-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: study-os/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/e2e/recovery.spec.ts --project=webkit-iphone --project=webkit-ipad --project=webkit-ipad-landscape --project=desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bkit-recovery-verification
          path: |
            study-os/test-results/
            study-os/playwright-report/
