name: Verify Exam Lab Before Mock Exam
on:
  push:
    branches:
      [feat/bkit-mock-lab-exam-eve-20261019, feat/exam-lab-immersive-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exam-study-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm ci --prefix exam-lab
      - name: Install browsers
        run: cd exam-lab && npx playwright install --with-deps chromium webkit
      - name: Serve independent exam lab
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 >/tmp/exam-lab-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4175/exam-lab/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/exam-lab-http.log
          exit 1
      - name: Smoke test mobile, Safari and desktop workflows
        run: |
          node --check exam-lab/app.js
          node --check exam-lab/learning.js
          node exam-lab/tests/smoke.mjs
          node exam-lab/tests/safety.mjs
          node exam-lab/tests/accessibility.mjs

      - name: Save responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-lab-responsive-qa
          path: /tmp/bkit-qa
