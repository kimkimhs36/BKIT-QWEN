<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BKIT · 모바일 화면 검증</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f7f5f0;color:#323d36;font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1100px;margin:auto}h1{font-size:25px;letter-spacing:-1px}p{color:#697369;line-height:1.6}label{display:inline-flex;gap:10px;align-items:center;margin:0 15px 16px 0}select,a{min-height:44px;padding:11px;border:1px solid #dddcd2;border-radius:12px;background:#fff;color:inherit}img{display:block;max-width:100%;max-height:78vh;margin:12px auto;border:1px solid #deded4;border-radius:20px;box-shadow:0 15px 60px #283a2519}a{display:inline-block;text-decoration:none;font-size:13px}small{display:block;color:#6d7369}</style><main><h1>BKIT 모바일 화면 검증</h1><p>WebKit 엔진에서 렌더링한 실제 화면입니다. 기기 크기와 화면 상태를 선택해 확인하세요.</p><label>기기 <select id="device"><option value="webkit-iphone">iPhone</option><option value="webkit-ipad">iPad 세로</option><option value="webkit-ipad-landscape">iPad 가로</option></select></label><label>화면 <select id="screen"><option value="empty-home">홈 · 처음 시작</option><option value="empty-focus">집중</option><option value="empty-tasks">과제</option><option value="empty-records">기록</option><option value="empty-tools">도구</option><option value="populated-home">과제가 있는 홈</option><option value="populated-records">주간 기록</option><option value="theme-picker">테마 선택</option><option value="running-focus">공부 중 타이머</option><option value="task-focus">과제와 연결한 집중</option><option value="keyboard-modal">키보드 높이 대응</option><option value="long-task">긴 과제명</option><option value="preserved-pdf">보존한 PDF</option><option value="gyro-enabled">센서 연결</option><option value="liquid-wave">물결 렌더링</option></select></label><a id="original" target="_blank" rel="noopener">원본 이미지 열기</a><img id="shot" alt="BKIT 검증 화면"><small>물리 기기 센서와 소프트웨어 키보드는 별도 실기기 확인 항목입니다. 자동 검증에서는 센서 이벤트와 키보드의 화면 높이 변화를 모의했습니다.</small></main><script>const device=document.getElementById('device'),screen=document.getElementById('screen'),shot=document.getElementById('shot'),original=document.getElementById('original');function update(){const path=device.value+'/'+screen.value+'.png';shot.src=path;original.href=path;shot.alt=device.selectedOptions[0].text+' · '+screen.selectedOptions[0].text}device.onchange=screen.onchange=update;update()</script></html>
