<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f2" />
    <script>
      /* Restore display preferences before paint; never write study storage. */ try {
        const r = document.documentElement,
          d = localStorage.getItem('bkit.study-os.theme.v1') === 'dark',
          p = JSON.parse(localStorage.getItem('bkit.material.v1') || 'null'),
          c = {
            classic: '#f3f2eb',
            forest: '#101e19',
            glass: '#e7edef',
            peach: '#f4eae1',
            diamond: '#edf0f5',
            gold: '#eee9dd',
            jelly: '#ece8f2',
            droplets: '#e5efeb',
            night: '#111923',
          },
          valid =
            p &&
            Object.hasOwn(c, p.id) &&
            ['auto', 'reduced', 'off'].includes(p.motion) &&
            Number.isFinite(p.intensity) &&
            p.intensity >= 0 &&
            p.intensity <= 1 &&
            typeof p.lowPower === 'boolean' &&
            ['forest', 'night'].includes(p.id) === d,
          id = valid ? p.id : d ? 'forest' : 'classic';
        r.dataset.bkitTheme = d ? 'dark' : 'light';
        r.dataset.material = id;
        r.dataset.effects =
          (valid && (p.lowPower || p.motion !== 'auto')) ||
          matchMedia('(prefers-reduced-motion: reduce)').matches
            ? 'none'
            : 'auto';
        r.style.backgroundColor = c[id];
        document.querySelector('meta[name="theme-color"]').content = c[id];
      } catch {
        document.documentElement.dataset.bkitTheme = 'light';
        document.documentElement.dataset.material = 'classic';
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>BKIT STUDY OS 3.6 — DRIVE & REWARD</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
